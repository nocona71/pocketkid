name: Maintenance proposal
description: Propose quality, audit, documentation, infrastructure, or compatibility work
title: "[Maintenance] "
labels:
  - "type:maintenance"
body:
  - type: dropdown
    id: area
    attributes:
      label: Work area
      options:
        - Quality
        - Auditability
        - Security
        - Documentation
        - Infrastructure
        - Upstream compatibility
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the maintenance risk, limitation, or cost.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and verification
      description: Include compatibility requirements and the checks that should pass.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched the backlog and existing issues for duplicates.
          required: true
