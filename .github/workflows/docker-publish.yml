name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAPID_PUBLIC_KEY: test-public-key
      VAPID_PRIVATE_KEY: test-private-key

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release tag and version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$RELEASE_PRERELEASE" != "false" ]; then
            echo "Pre-releases are not supported by this stable release workflow" >&2
            exit 1
          fi

          version="$(tr -d '\r\n' < VERSION)"

          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a stable semantic version, got: $version" >&2
            exit 1
          fi

          expected_tag="fork-v${version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match VERSION ($expected_tag)" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "Release commit must be contained in master" >&2
            exit 1
          fi

          major="${version%%.*}"
          major_minor="${version%.*}"
          publish_major=true
          if [ "$major" = "0" ]; then
            publish_major=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "publish_major=$publish_major" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.publish_major }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.version.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}

      - name: Build release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          docker run --rm \
            --env EXPECTED_VERSION \
            --env VAPID_PUBLIC_KEY \
            --env VAPID_PRIVATE_KEY \
            "$RELEASE_IMAGE" \
            python -c 'import os; from pocketkid.config import APP_VERSION; assert APP_VERSION == os.environ["EXPECTED_VERSION"]'

      - name: Start and verify release container
        shell: bash
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          docker run --detach --name pocketkid-release-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env VAPID_PUBLIC_KEY \
            --env VAPID_PRIVATE_KEY \
            "$RELEASE_IMAGE"

          for attempt in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8000/ || true)"
            if [ "$status" = "302" ]; then
              exit 0
            fi
            sleep 1
          done

          docker logs pocketkid-release-smoke
          exit 1

      - name: Stop release smoke-test container
        if: always()
        run: docker rm --force pocketkid-release-smoke || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image tags
        id: publish
        shell: bash
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          push_output="$(docker push "$RELEASE_IMAGE")"
          printf '%s\n' "$push_output"

          digest="$(printf '%s\n' "$push_output" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          if [ -z "$digest" ]; then
            echo "Could not determine published image digest" >&2
            exit 1
          fi

          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$RELEASE_IMAGE" ]; then
              docker push "$tag"
            fi
          done <<< "$DOCKER_TAGS"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
