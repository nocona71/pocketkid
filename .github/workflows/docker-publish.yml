name: Publish release image

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag to publish
        required: true
        type: string
      release_prerelease:
        description: Whether the release is a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAPID_PUBLIC_KEY: test-public-key
      VAPID_PRIVATE_KEY: test-private-key

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Validate release tag and version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease == true) || (github.event_name != 'release' && inputs.release_prerelease == true) }}
        run: |
          if [ "$RELEASE_PRERELEASE" != "false" ]; then
            echo "Pre-releases are not supported by this stable release workflow" >&2
            exit 1
          fi

          version="$(tr -d '\r\n' < VERSION)"

          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a stable semantic version, got: $version" >&2
            exit 1
          fi

          expected_tag="fork-v${version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match VERSION ($expected_tag)" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "Release commit must be contained in master" >&2
            exit 1
          fi

          major="${version%%.*}"
          major_minor="${version%.*}"
          commit="$(git rev-parse HEAD)"
          publish_major=true
          if [ "$major" = "0" ]; then
            publish_major=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "publish_major=$publish_major" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run checks
        run: ./scripts/check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.publish_major }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.version.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}

      - name: Build release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release container
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: ./scripts/container-smoke --expected-version "${{ steps.version.outputs.version }}" "$RELEASE_IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image tags
        id: publish
        shell: bash
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          push_output="$(docker push "$RELEASE_IMAGE")"
          printf '%s\n' "$push_output"

          digest="$(printf '%s\n' "$push_output" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          if [ -z "$digest" ]; then
            echo "Could not determine published image digest" >&2
            exit 1
          fi

          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$RELEASE_IMAGE" ]; then
              docker push "$tag"
            fi
          done <<< "$DOCKER_TAGS"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
