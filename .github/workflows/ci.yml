name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAPID_PUBLIC_KEY: test-public-key
      VAPID_PRIVATE_KEY: test-private-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  container-smoke-test:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build container image
        run: docker build --tag pocketkid:ci .

      - name: Start and verify container
        shell: bash
        run: |
          docker run --detach --name pocketkid-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env VAPID_PUBLIC_KEY=test-public-key \
            --env VAPID_PRIVATE_KEY=test-private-key \
            pocketkid:ci

          for attempt in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8000/ || true)"
            if [ "$status" = "302" ]; then
              exit 0
            fi
            sleep 1
          done

          docker logs pocketkid-smoke
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force pocketkid-smoke || true
