name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Trigger CI for release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PULL_REQUESTS: ${{ steps.release.outputs.prs }}
        run: |
          head_branch="$(jq -r '.[0].headBranchName // empty' <<< "$RELEASE_PULL_REQUESTS")"
          if [ -z "$head_branch" ]; then
            echo "Release Please did not return a pull-request branch" >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "$head_branch"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
